name: Build Packages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: ltm_windows
            script_ext: .bat
            script_content: |
              @echo off
              lua src\main.lua %*
          - os: ubuntu-latest
            name: ltm_linux
            script_ext: .sh
            script_content: |
              #!/bin/bash
              lua src/main.lua "$@"
          - os: macos-latest
            name: ltm_macos
            script_ext: .sh
            script_content: |
              #!/bin/bash
              lua src/main.lua "$@"
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Lua (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y lua5.4
        
    - name: Install Lua (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install lua
        
    - name: Install Lua (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install lua -y
        
    - name: Create launcher script
      shell: bash
      run: |
        echo "${{ matrix.script_content }}" > ltm${{ matrix.script_ext }}
        chmod +x ltm${{ matrix.script_ext }} || true
        
    - name: Create package
      shell: bash
      run: |
        mkdir -p package
        cp -r src package/
        cp ltm${{ matrix.script_ext }} package/
        
    - name: Create archive
      shell: bash
      run: |
        cd package
        if [ "${{ runner.os }}" == "Windows" ]; then
          7z a ../${{ matrix.name }}.zip .
        else
          tar -czf ../${{ matrix.name }}.tar.gz .
        fi
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: ${{ matrix.name }}
        path: |
          ${{ matrix.name }}.zip
          ${{ matrix.name }}.tar.gz